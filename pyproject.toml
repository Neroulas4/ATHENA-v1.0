[project]
name = "athena-ai"
version = "0.9.0"
description = "ATHENA hosted-ready multi-agent intelligence runtime"
requires-python = ">=3.11"
dependencies = ["openai-agents>=0.3.0", "pydantic>=2.0"]

[project.scripts]
athena = "athena.app:main"

[tool.setuptools]
packages = ["athena"]
package-dir = {"athena" = "."}

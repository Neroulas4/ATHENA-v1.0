[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[project]
name = "athena"
version = "0.1.0"
description = "ATHENA evidence-led market intelligence"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "fastapi>=0.115",
    "openai-agents>=0.14",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "uvicorn>=0.30",
    "loguru>=0.7.3",
    "mcp>=2.2,<3",
    "PyJWT>=2.10,<3",
]

[project.optional-dependencies]
test = ["pytest>=8"]
yfinance = ["yfinance>=0.2"]

[project.scripts]
athena = "athena.app:main"
athena-worker = "athena.worker:main"

[tool.uv.build-backend]
module-name = "athena"
module-root = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

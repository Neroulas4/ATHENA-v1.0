services:
  - type: web
    name: athena-runtime
    runtime: python
    buildCommand: pip install -e .
    startCommand: uvicorn athena.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: ATHENA_DB_PATH
        value: /var/data/athena.db
    disk:
      name: athena-data
      mountPath: /var/data
      sizeGB: 1
